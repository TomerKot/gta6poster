# або подивись у вихідному коді сторінки ("channelId"). Потім розкоментуй.
# [[sources]]
# name = "Rockstar Games (YouTube)"
# url = "https://www.youtube.com/feeds/videos.xml?channel_id=ВСТАВ_ID"

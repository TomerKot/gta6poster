# Налаштування бота. Усі регулярки — без урахування регістру.
# Рядки в одинарних лапках ('...') — літерали, зворотний слеш екранувати не треба.

[settings]
max_posts_per_run = 5        # антиспам: не більше N постів за один запуск
max_age_hours = 48           # старіше — ігноруємо
snippet_chars = 280          # довжина уривка (цитуємо коротко, решта — за посиланням)
seconds_between_posts = 3    # пауза між постами (ліміти Telegram)

[filters]
# Новина проходить, якщо в заголовку/описі є хоча б один збіг
# (для джерел з requires_keyword = true, тобто загальних стрічок).
keywords = [
  '\bGTA\s?(6|VI)\b',
  '\bGrand Theft Auto\s?(6|VI)\b',
  '\bLeonida\b',
]

# Відсікаємо: піратство, "безкоштовне завантаження", роздачі — типові приманки для malware.
# Також не постимо "витік" відео/збірок/ассетів (ризик DMCA/блокування каналу).
block = [
  '\b(torrent|cracked?|apk|keygen|giveaway)\b',
  '\bfree (download|key|keys|code|codes)\b',
  '\bdownload (for )?free\b',
  '\bbeta (key|access|download)\b',
  'завантажити (безкоштовно|apk)',
  '\bleaked (footage|gameplay|video|build|images?|screenshots?|source code)\b',
]

# Не блокуємо, але позначаємо "⚠️ неперевірена інформація".
rumor = [
  '\b(leak(s|ed)?|rumou?rs?|insider|reportedly|allegedly|speculation)\b',
  '\b(витік|чутки|інсайд)\b',
]

# ---------------------------------------------------------------------------
# ДЖЕРЕЛА. official = true -> публікуються першими.
# requires_keyword = false -> стрічка вже тематична, фільтр за словами не потрібен.
# Перший запуск у GitHub Actions покаже в логах, які URL не відповіли.
# ---------------------------------------------------------------------------

[[sources]]
name = "Google News: GTA 6"
url = "https://news.google.com/rss/search?q=%22GTA+6%22+OR+%22GTA+VI%22+when:2d&hl=en-US&gl=US&ceid=US:en"
requires_keyword = false


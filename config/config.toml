# requires_keyword = true

# --- Bluesky: у кожного профілю є RSS. Додавай журналістів/інсайдерів, яким довіряєш ---
# [[sources]]
# name = "Bluesky: handle"
# url = "https://bsky.app/profile/HANDLE.bsky.social/rss"
# requires_keyword = true

# --- Reddit: ВИМКНЕНО. З травня 2026 .json дає 403, API потребує ручного схвалення,
# а RSS з IP датацентрів (GitHub Actions) найімовірніше блокується. Можна спробувати:
[[sources]]
name = "Reddit r/GTA6"
url = "https://www.reddit.com/r/GTA6/top/.rss?t=day"
enabled = false
requires_keyword = false

# --- X/Twitter: свідомо НЕ додано. Безкоштовного читання API немає (2026),
# "Nitter"/скрапери порушують ToS і постійно ламаються. Див. docs/ANALYSIS.md.
